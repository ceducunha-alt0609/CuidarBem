name: Fix CuidarBem native home scroll
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-native-home-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python cuidarbem_patch_native_home_scroll.py
      - name: Verify
        run: |
          grep -q 'cuidarbem-v75-16-native-home-scroll' index.html
          grep -q 'overflow-y: auto !important' index.html
          grep -q 'cuidarbem-v60-native-home-scroll' sw.js
      - name: Commit app fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Restore native wheel and middle-click scroll on home'
          git push
      - name: Cleanup temporary files
        run: |
          git pull --rebase
          rm -f cuidarbem_patch_native_home_scroll.py .github/workflows/cuidarbem-native-home-scroll.yml
          git add -A
          git commit -m 'Clean native home scroll patch files'
          git push
