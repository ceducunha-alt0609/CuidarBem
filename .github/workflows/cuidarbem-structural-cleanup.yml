name: Run CuidarBem structural cleanup patch
on:
  push:
    paths:
      - 'cuidarbem_patch_structural_cleanup.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_patch_structural_cleanup.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '_patchedGoScreen' not in s
          assert 'const _origConfirmTake = window.confirmTake' not in s
          assert 'finally {' in s and 'window.Notification = _origNew;' in s
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Remove dead CuidarBem patches and harden notifications' || exit 0
          git rm -f cuidarbem_patch_structural_cleanup.py .github/workflows/cuidarbem-structural-cleanup.yml cuidarbem_structural_audit.py .github/workflows/cuidarbem-structural-audit.yml cuidarbem_structural_audit.txt
          git commit -m 'Clean CuidarBem structural audit files' || true
          git push
