name: CuidarBem desktop topbar v75.88
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-88-desktop-topbar-clean.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean desktop topbar
        run: python cuidarbem_patch_v7588_desktop_topbar_clean.py
      - name: Verify patch
        run: |
          grep -q 'cuidarbem-v75-88-desktop-topbar-clean' index.html
          grep -q 'cuidarbem-v75-88-desktop-topbar-clean' sw.js
          grep -q 'cb7586-search' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Clean desktop topbar v75.88'
          git push
