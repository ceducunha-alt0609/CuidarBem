name: Run CuidarBem structural audit
on:
  push:
    paths:
      - 'cuidarbem_structural_audit.py'
      - '.github/workflows/cuidarbem-structural-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_structural_audit.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cuidarbem_structural_audit.txt
          git commit -m 'Audit CuidarBem structural leftovers' || exit 0
          git push
