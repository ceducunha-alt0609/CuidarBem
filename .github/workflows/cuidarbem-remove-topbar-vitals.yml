name: Remove CuidarBem topbar vitals
on:
  push:
    paths:
      - 'cuidarbem_remove_topbar_vitals.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_remove_topbar_vitals.py
      - name: Verify and commit
        run: |
          ! grep -q 'id="vitals-bar-main"' index.html
          grep -q 'id="tab-bp"' index.html
          grep -q 'id="tab-gluc"' index.html
          grep -q 'id="tab-spo2"' index.html
          grep -q 'id="tab-temp"' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Remove vital panels from CuidarBem topbar'
          git rm -f cuidarbem_remove_topbar_vitals.py .github/workflows/cuidarbem-remove-topbar-vitals.yml
          git commit -m 'Clean CuidarBem topbar patch files'
          git push
