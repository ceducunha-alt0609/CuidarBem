name: Run CuidarBem UTC date audit
on:
  push:
    paths:
      - 'cuidarbem_audit_utc_dates.py'
      - '.github/workflows/cuidarbem-utc-dates-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_audit_utc_dates.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cuidarbem_utc_dates_audit.txt
          git commit -m 'Audit CuidarBem UTC calendar dates' || exit 0
          git push
