name: Run CuidarBem alarm and backup audit
on:
  push:
    paths:
      - 'cuidarbem_audit_alarm_backup.py'
      - '.github/workflows/cuidarbem-alarm-backup-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_audit_alarm_backup.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cuidarbem_alarm_backup_audit.txt
          git commit -m 'Audit CuidarBem alarms and backups' || exit 0
          git push
