name: Apply CuidarBem v75.23 desktop shell
on:
  push:
    paths:
      - 'cuidarbem_patch_v7523_desktop_shell.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop shell patch
        run: python cuidarbem_patch_v7523_desktop_shell.py
      - name: Verify
        run: |
          grep -q 'cuidarbem-v75-23-desktop-shell' index.html
          grep -q 'cb-desktop-search' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply CuidarBem v75.23 desktop topbar and global search'
          git push
