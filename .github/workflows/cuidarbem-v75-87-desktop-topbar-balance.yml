name: CuidarBem desktop topbar v75.87
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-87-desktop-topbar-balance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Balance desktop topbar
        run: python cuidarbem_patch_v7587_desktop_topbar_balance.py
      - name: Verify patch
        run: |
          grep -q 'cuidarbem-v75-87-desktop-topbar-balance' index.html
          grep -q 'cuidarbem-v75-87-desktop-topbar-balance' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Balance desktop topbar v75.87'
          git push
