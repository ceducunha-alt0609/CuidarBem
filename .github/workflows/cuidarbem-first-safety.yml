name: Run CuidarBem first safety patch
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-first-safety.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_patch_first_safety.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f cuidarbem_patch_first_safety.py cuidarbem_audit_report.txt .github/workflows/cuidarbem-first-safety.yml
          git add -A
          git commit -m 'Harden CuidarBem PWA seed and local dates'
          git push
