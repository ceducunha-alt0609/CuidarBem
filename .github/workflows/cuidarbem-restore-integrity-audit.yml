name: Run CuidarBem restore integrity audit
on:
  push:
    paths:
      - 'cuidarbem_audit_restore_integrity.py'
      - '.github/workflows/cuidarbem-restore-integrity-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_audit_restore_integrity.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cuidarbem_restore_integrity_audit.txt
          git commit -m 'Audit CuidarBem restore integrity' || exit 0
          git push
