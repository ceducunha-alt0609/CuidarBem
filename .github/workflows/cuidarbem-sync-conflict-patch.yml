name: Run CuidarBem sync conflict patch
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-sync-conflict-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_patch_sync_conflict.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f cuidarbem_patch_sync_conflict.py cuidarbem_sync_conflict_report.txt .github/workflows/cuidarbem-sync-conflict-patch.yml
          git add -A
          git commit -m 'Protect CuidarBem offline sync conflicts'
          git push
