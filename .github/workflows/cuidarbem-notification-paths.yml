name: Run CuidarBem notification path patch
on:
  push:
    paths:
      - 'cuidarbem_patch_notification_paths.py'
      - '.github/workflows/cuidarbem-notification-paths.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_patch_notification_paths.py
      - name: Verify and commit
        run: |
          grep -q "icons/icon-192.png" index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Fix CuidarBem in-app notification icon paths' || exit 0
          git rm -f cuidarbem_patch_notification_paths.py .github/workflows/cuidarbem-notification-paths.yml 2>/dev/null || true
          git commit -m 'Clean CuidarBem notification patch files' || true
          git push
