name: Run CuidarBem mobile render audit
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-mobile-render-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_mobile_render_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cuidarbem_mobile_render_report.txt
          git commit -m 'Report CuidarBem mobile rendering hotspots'
          git push
