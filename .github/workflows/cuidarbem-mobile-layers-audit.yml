name: Run CuidarBem mobile layers audit
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-mobile-layers-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_mobile_layers_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cuidarbem_mobile_layers_report.txt
          git commit -m 'Report CuidarBem mobile compositor layers'
          git push
