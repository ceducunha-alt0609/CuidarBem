name: Apply CuidarBem desktop refinement
on:
  push:
    paths:
      - '.github/workflows/apply-cuidarbem-v75-31-desktop-shell-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix compact centered global search patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('#creen-calendar > .header-sub', '#screen-calendar > .header-sub')
          s = s.replace('#creen-dashboard > .header-sub', '#screen-dashboard > .header-sub')
          s = s.replace('#creen-reports > .header-sub', '#screen-reports > .header-sub')
          s = s.replace("\n()})();\n</script>", "\n})();\n</script>")
          index.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(r"const CACHE_NAME = 'cuidarbem-[^']+';", "const CACHE_NAME = 'cuidarbem-v64-global-search-centered-fix';", t, count=1)
          sw.write_text(t, encoding='utf-8')
          PY
      - name: Verify final search patch
        run: |
          grep -q 'cuidarbem-v75-33-global-search-centered' index.html
          grep -q '#screen-calendar > .header-sub' index.html
          grep -q '#screen-dashboard > .header-sub' index.html
          grep -q '#screen-reports > .header-sub' index.html
          grep -q 'cuidarbem-v64-global-search-centered-fix' sw.js
          ! grep -q '#creen-calendar > .header-sub' index.html
          ! grep -q '#creen-dashboard > .header-sub' index.html
          ! grep -q '#creen-reports > .header-sub' index.html
          ! grep -q '()})();' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix centered global search patch v75.33'
          git push
