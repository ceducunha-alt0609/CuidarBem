name: Run CuidarBem sync conflict audit
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-sync-conflict-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_sync_conflict_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f cuidarbem_sync_conflict_audit.py cuidarbem_sync_audit_report.txt .github/workflows/cuidarbem-sync-conflict-audit.yml
          git add -A
          git commit -m 'Audit CuidarBem sync conflict handling'
          git push
