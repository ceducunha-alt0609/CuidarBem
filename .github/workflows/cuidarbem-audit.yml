name: Run CuidarBem structural audit
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python cuidarbem_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f cuidarbem_audit.py .github/workflows/cuidarbem-audit.yml
          git add -A
          git commit -m 'Audit CuidarBem structure'
          git push
