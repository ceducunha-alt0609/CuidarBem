name: CuidarBem mobile refinements v75.46
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove conflicting picker listener
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify conflict removal
        run: |
          grep -q 'cuidarbem-v75-46-remove-picker-conflict' index.html
          ! grep -q 'cuidarbem-v75-44-state-picker-direct-js' index.html
          grep -q 'cuidarbem-v75-45-state-picker-storage-js' index.html
          grep -q 'cuidarbem-v75-46-remove-picker-conflict' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Remove conflicting old state picker listener v75.46'
          git push
