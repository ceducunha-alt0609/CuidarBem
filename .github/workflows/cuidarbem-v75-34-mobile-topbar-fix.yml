name: CuidarBem mobile refinements v75.75
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror exames card for consultas
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify consultas mirror
        run: |
          grep -q 'cuidarbem-v75-75-consultas-mirror-exames' index.html
          grep -q 'cuidarbem-v75-75-consultas-mirror-exames' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Mirror exames card for consultas v75.75'
          git push
