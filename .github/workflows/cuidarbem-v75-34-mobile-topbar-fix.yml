name: CuidarBem mobile refinements v75.62
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove static Home prepaint
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify static Home removal
        run: |
          grep -q 'cuidarbem-v75-62-no-static-home-flash' index.html
          grep -q 'cuidarbem-v75-62-no-static-home-flash' sw.js
          ! grep -q 'class="screen active" id="screen-home"' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Remove static Home flash on boot v75.62'
          git push
