name: Repair CuidarBem mobile topbar + pull refresh v75.36
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile topbar and pull refresh repair
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify mobile repairs
        run: |
          grep -q 'cuidarbem-v75-35-mobile-topbar-root-fix' index.html
          grep -q 'if(window.innerWidth < 768) return;' index.html
          grep -q 'cuidarbem-v75-36-pull-refresh' index.html
          grep -q 'cuidarbem-v75-36-pull-refresh' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix mobile Home and add pull refresh v75.36'
          git push
