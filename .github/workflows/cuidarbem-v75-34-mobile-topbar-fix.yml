name: CuidarBem mobile refinements v75.81
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add More navigation and Patient module
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify navigation architecture
        run: |
          grep -q 'cuidarbem-v75-81-more-patient-nav' index.html
          grep -q 'cuidarbem-v75-81-more-patient-nav' sw.js
          grep -q 'cb7581-patient-screen' index.html
          grep -q 'cb7581-more-sheet' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Add More navigation and Patient module v75.81'
          git push
