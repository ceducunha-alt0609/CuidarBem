name: CuidarBem mobile refinements v75.68
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label medication schedule groups
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify medication time labels
        run: |
          grep -q 'cuidarbem-v75-68-medication-time-labels' index.html
          grep -q 'cuidarbem-v75-68-medication-time-labels' sw.js
          grep -q 'Período do tratamento' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Label medication schedule groups v75.68'
          git push
