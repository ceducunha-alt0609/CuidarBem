name: CuidarBem mobile refinements v75.43
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply state toggle fix
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify source toggle fix
        run: |
          grep -q 'cuidarbem-v75-43-toggle-at-source' index.html
          grep -q "const next=(log && log\[key\]===val) ? '' : val" index.html
          grep -q 'cuidarbem-v75-43-toggle-at-source' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix state deselection at source v75.43'
          git push
