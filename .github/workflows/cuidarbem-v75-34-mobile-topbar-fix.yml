name: CuidarBem mobile refinements v75.61
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix refresh last-screen race
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify refresh race fix
        run: |
          grep -q 'cuidarbem-v75-61-refresh-race-fix' index.html
          grep -q 'cuidarbem-v75-61-refresh-race-fix' sw.js
          grep -q 'cuidarbem_last_screen' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix refresh last-screen race v75.61'
          git push
