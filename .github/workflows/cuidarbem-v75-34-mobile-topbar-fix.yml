name: CuidarBem mobile refinements v75.49
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten AI risk rows
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify tighter risk rows
        run: |
          grep -q 'cuidarbem-v75-49-risk-tight' index.html
          grep -q 'cuidarbem-v75-49-risk-tight' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Tighten mobile AI risk rows v75.49'
          git push
