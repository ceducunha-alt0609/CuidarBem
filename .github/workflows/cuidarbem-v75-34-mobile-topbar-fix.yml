name: CuidarBem mobile refinements v75.77
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean conflicting Consultas Exames patches
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify clean Consultas Exames patch
        run: |
          grep -q 'cuidarbem-v75-77-consultas-exames-clean' index.html
          grep -q 'cuidarbem-v75-77-consultas-exames-clean' sw.js
          ! grep -q 'cuidarbem-v75-76-consultas-exames-stable-js' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Clean and stabilize Consultas Exames v75.77'
          git push
