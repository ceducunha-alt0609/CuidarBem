name: CuidarBem mobile refinements v75.71
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Target real Reports DOM
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify Reports real DOM patch
        run: |
          grep -q 'cuidarbem-v75-71-reports-real-dom' index.html
          grep -q 'cuidarbem-v75-71-reports-real-dom' sw.js
          grep -q 'cb7571-summary' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Target real Reports DOM v75.71'
          git push
