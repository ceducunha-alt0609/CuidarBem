name: CuidarBem mobile refinements v75.54
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply caregiver-first Health cleanup
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify caregiver Health cleanup
        run: |
          grep -q 'cuidarbem-v75-54-caregiver-health' index.html
          grep -q 'cuidarbem-v75-54-caregiver-health' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Refine Health for caregiver workflow v75.54'
          git push
