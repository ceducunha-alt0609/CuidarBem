name: CuidarBem mobile refinements v75.85
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Organize Patient sections
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify Patient sections
        run: |
          grep -q 'cuidarbem-v75-85-patient-sections' index.html
          grep -q 'cuidarbem-v75-85-patient-sections' sw.js
          grep -q 'cb7585-patient-index' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Organize Patient sections v75.85'
          git push
