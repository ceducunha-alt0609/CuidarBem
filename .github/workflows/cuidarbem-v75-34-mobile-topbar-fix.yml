name: CuidarBem mobile refinements v75.57
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compact complication checklist
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify complication checklist patch
        run: |
          grep -q 'cuidarbem-v75-57-complications-compact' index.html
          grep -q 'cuidarbem-v75-57-complications-compact' sw.js
          grep -q 'complication-card' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Compact complication checklist v75.57'
          git push
