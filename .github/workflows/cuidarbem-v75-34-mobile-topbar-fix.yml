name: CuidarBem mobile refinements v75.64
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix medication header
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify medication header fix
        run: |
          grep -q 'cuidarbem-v75-64-medication-header-fix' index.html
          grep -q 'cuidarbem-v75-64-medication-header-fix' sw.js
          grep -q "t.textContent='💊 Adicionar medicamento'" index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix medication header overlap v75.64'
          git push
