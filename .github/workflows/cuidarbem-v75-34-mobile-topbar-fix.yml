name: CuidarBem mobile refinements v75.84
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean More and fix gear
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify More cleanup and gear fix
        run: |
          grep -q 'cuidarbem-v75-84-more-cleanup-a11y-fix' index.html
          grep -q 'cuidarbem-v75-84-more-cleanup-a11y-fix' sw.js
          grep -q 'cb7584-force-open' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Clean More and fix accessibility gear v75.84'
          git push
