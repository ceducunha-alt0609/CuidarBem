name: CuidarBem mobile refinements v75.69
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add automatic medication times
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify automatic medication times
        run: |
          grep -q 'cuidarbem-v75-69-medication-auto-times' index.html
          grep -q 'cuidarbem-v75-69-medication-auto-times' sw.js
          grep -q 'cb7569-suggested' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Auto-suggest medication times v75.69'
          git push
