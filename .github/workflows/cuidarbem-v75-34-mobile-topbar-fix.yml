name: CuidarBem mobile refinements v75.74
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Proximas consultas card
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify consultas card fix
        run: |
          grep -q 'cuidarbem-v75-74-consultas-card-fix' index.html
          grep -q 'cuidarbem-v75-74-consultas-card-fix' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix Proximas consultas mobile card v75.74'
          git push
