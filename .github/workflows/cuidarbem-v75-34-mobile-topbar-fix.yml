name: CuidarBem mobile refinements v75.47
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Center patient state actions
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify centered state actions
        run: |
          grep -q 'cuidarbem-v75-47-center-state-actions' index.html
          grep -q 'cuidarbem-v75-47-center-state-actions' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Center patient state action buttons v75.47'
          git push
