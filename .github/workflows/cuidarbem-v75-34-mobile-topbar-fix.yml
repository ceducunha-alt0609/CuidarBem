name: CuidarBem mobile refinements v75.76
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stabilize Consultas Exames cards
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify stable cards
        run: |
          grep -q 'cuidarbem-v75-76-consultas-exames-stable' index.html
          grep -q 'cuidarbem-v75-76-consultas-exames-stable' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Stabilize Consultas Exames cards v75.76'
          git push
