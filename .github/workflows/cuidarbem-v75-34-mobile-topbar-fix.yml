name: CuidarBem mobile refinements v75.44
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply state picker fix
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify direct picker and clear
        run: |
          grep -q 'cuidarbem-v75-44-state-picker-direct' index.html
          grep -q 'Limpar seleção' index.html
          grep -q 'cuidarbem-v75-44-state-picker-direct' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix direct state picker and add clear button v75.44'
          git push
