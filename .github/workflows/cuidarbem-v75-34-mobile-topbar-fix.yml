name: CuidarBem mobile refinements v75.60
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refresh prepaint fix
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify refresh prepaint fix
        run: |
          grep -q 'cuidarbem-v75-60-refresh-prepaint' index.html
          grep -q 'cuidarbem-v75-60-refresh-prepaint' sw.js
          grep -q 'cuidarbem_last_screen_v759' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Prevent wrong-screen flash on refresh v75.60'
          git push
