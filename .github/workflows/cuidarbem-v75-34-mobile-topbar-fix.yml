name: CuidarBem mobile refinements v75.65
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify medication intake
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify medication simple choice
        run: |
          grep -q 'cuidarbem-v75-65-medication-simple-choice' index.html
          grep -q 'cuidarbem-v75-65-medication-simple-choice' sw.js
          grep -q 'Toque para ler a receita' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Simplify medication intake v75.65'
          git push
