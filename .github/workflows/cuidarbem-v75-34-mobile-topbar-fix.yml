name: CuidarBem mobile refinements v75.45
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply state picker storage fix
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify state storage picker
        run: |
          grep -q 'cuidarbem-v75-45-state-picker-storage' index.html
          grep -q "cb75_daily_log_v75" index.html
          grep -q 'cuidarbem-v75-45-state-picker-storage' sw.js
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Make patient state picker persist directly v75.45'
          git push
