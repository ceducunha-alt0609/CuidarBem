name: CuidarBem mobile refinements v75.55
on:
  push:
    paths:
      - '.github/workflows/cuidarbem-v75-34-mobile-topbar-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct Health selectors
        run: python cuidarbem_patch_v7534_mobile_topbar.py
      - name: Verify direct Health patch
        run: |
          grep -q 'cuidarbem-v75-55-health-direct' index.html
          grep -q 'cuidarbem-v75-55-health-direct' sw.js
          grep -q 'cb75-edu-card' index.html
          grep -q 'vital-history' index.html
      - name: Commit app update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Use direct Health DOM selectors v75.55'
          git push
