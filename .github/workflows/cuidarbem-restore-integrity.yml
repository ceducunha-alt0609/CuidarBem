name: Run CuidarBem restore integrity patch
on:
  push:
    paths:
      - 'cuidarbem_patch_restore_integrity.py'
      - '.github/workflows/cuidarbem-restore-integrity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cuidarbem_patch_restore_integrity.py
      - name: Verify and commit
        run: |
          grep -q "function validateSnapshot" index.html
          grep -q "backupVersion: 2" index.html
          grep -q "localStorage.getItem('paciente')" index.html
          grep -q "cuidarbem-v57-restore-integrity" sw.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m 'Harden CuidarBem backup restore integrity' || exit 0
          git rm -f cuidarbem_patch_restore_integrity.py .github/workflows/cuidarbem-restore-integrity.yml cuidarbem_audit_restore_integrity.py .github/workflows/cuidarbem-restore-integrity-audit.yml cuidarbem_restore_integrity_audit.txt 2>/dev/null || true
          git commit -m 'Clean CuidarBem restore audit files' || true
          git push
